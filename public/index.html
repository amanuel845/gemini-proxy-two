<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemini Proxy Playground</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b1020;
    --panel: #131a2e;
    --panel-2: #1c2440;
    --border: #26304f;
    --text: #e6ecff;
    --muted: #8894b8;
    --accent: #6a8bff;
    --accent-2: #8a5cff;
    --user: #24325c;
    --assistant: #1a2340;
    --error: #ff6b6b;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  body { display: flex; flex-direction: column; }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header .spacer { flex: 1; }
  select, input, textarea, button {
    font: inherit;
    color: inherit;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    padding: 8px 12px;
    outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 12px 18px;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    background: none;
    border-radius: 0;
    border-left: none; border-right: none; border-top: none;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  .view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }

  /* Chat */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 780px;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--assistant); }
  .msg.role { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .msg .content { white-space: pre-wrap; }

  .composer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 180px;
    font-family: inherit;
  }
  .composer button {
    padding: 10px 20px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Vision */
  #visionPane {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    align-items: stretch;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .2s;
  }
  .drop:hover { border-color: var(--accent); }
  .drop img { max-width: 100%; max-height: 320px; border-radius: 8px; margin-top: 12px; }
  #visionOutput {
    white-space: pre-wrap;
    line-height: 1.6;
    background: var(--panel-2);
    padding: 16px;
    border-radius: 12px;
    min-height: 80px;
  }

  .status { font-size: 12px; color: var(--muted); padding: 6px 24px; }
  .error { color: var(--error); }
</style>
</head>
<body>

<header>
  <h1>✦ Gemini Proxy Playground</h1>
  <div class="spacer"></div>
  <label style="font-size:13px;color:var(--muted)">Model&nbsp;</label>
  <select id="modelSelect">
    <option value="gemini-3.6-flash" selected>gemini-3.6-flash</option>
    <option value="gemini-2.5-pro">gemini-2.5-pro</option>
    <option value="gemini-2.0-flash">gemini-2.0-flash</option>
    <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite</option>
  </select>
</header>

<div class="tabs">
  <button class="tab active" data-tab="chat">Chat</button>
  <button class="tab" data-tab="vision">Vision</button>
  <button class="tab" id="clearBtn" style="margin-left:auto;color:var(--error)">Clear</button>
</div>

<main>
  <!-- CHAT -->
  <section class="view active" id="view-chat">
    <div id="messages"></div>
    <form class="composer" id="chatForm">
      <textarea id="chatInput" placeholder="Ask anything… (Shift+Enter for newline)" rows="1"></textarea>
      <button type="submit" id="sendBtn">Send</button>
    </form>
    <div class="status" id="chatStatus">Ready.</div>
  </section>

  <!-- VISION -->
  <section class="view" id="view-vision">
    <div id="visionPane">
      <div class="drop" id="dropZone">
        <div id="dropText">Click or drop an image here</div>
        <input type="file" id="fileInput" accept="image/*" hidden />
        <img id="preview" hidden />
      </div>
      <textarea id="visionPrompt" rows="2" placeholder="Ask about the image…">Describe this image in detail.</textarea>
      <button id="visionBtn" style="align-self:flex-start;padding:10px 20px;background:linear-gradient(90deg,var(--accent),var(--accent-2));border:none;font-weight:600;cursor:pointer;border-radius:8px;">Analyze Image</button>
      <div id="visionOutput">Output will appear here.</div>
      <div class="status" id="visionStatus">Ready.</div>
    </div>
  </section>
</main>

<script>
/* ---------------------------------------------------------
   Config — API base is same origin by default.
   Change this if the frontend is hosted somewhere else.
--------------------------------------------------------- */
const API_BASE = "";  // e.g. "https://your-proxy.vercel.app"

/* ------------------------- Tabs ------------------------- */
document.querySelectorAll(".tab[data-tab]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("view-" + btn.dataset.tab).classList.add("active");
  });
});

/* ------------------------ Chat -------------------------- */
const chatForm = document.getElementById("chatForm");
const chatInput = document.getElementById("chatInput");
const messages = document.getElementById("messages");
const sendBtn = document.getElementById("sendBtn");
const chatStatus = document.getElementById("chatStatus");
const modelSelect = document.getElementById("modelSelect");

const history = [];

function addMessage(role, text = "") {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<div class="role">${role}</div><div class="content"></div>`;
  div.querySelector(".content").textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

chatInput.addEventListener("input", () => {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 180) + "px";
});

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    chatForm.requestSubmit();
  }
});

chatForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const prompt = chatInput.value.trim();
  if (!prompt || sendBtn.disabled) return;

  addMessage("user", prompt);
  chatInput.value = "";
  chatInput.style.height = "auto";

  sendBtn.disabled = true;
  chatStatus.textContent = "Streaming…";
  chatStatus.className = "status";

  const assistantDiv = addMessage("assistant", "");
  const contentEl = assistantDiv.querySelector(".content");

  try {
    const resp = await fetch(`${API_BASE}/api/stream`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt,
        model: modelSelect.value,
        history: history.slice(-20), // last 20 turns
      }),
    });

    if (!resp.ok || !resp.body) {
      throw new Error(`HTTP ${resp.status} — ${await resp.text()}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let full = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      full += decoder.decode(value, { stream: true });
      contentEl.textContent = full;
      messages.scrollTop = messages.scrollHeight;
    }

    history.push({ role: "user", text: prompt });
    history.push({ role: "assistant", text: full });
    chatStatus.textContent = "Done.";
  } catch (err) {
    contentEl.textContent = "⚠️ " + err.message;
    chatStatus.textContent = "Error: " + err.message;
    chatStatus.className = "status error";
  } finally {
    sendBtn.disabled = false;
  }
});

/* ------------------------ Vision ------------------------ */
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const dropText = document.getElementById("dropText");
const visionPrompt = document.getElementById("visionPrompt");
const visionBtn = document.getElementById("visionBtn");
const visionOutput = document.getElementById("visionOutput");
const visionStatus = document.getElementById("visionStatus");

let currentImageBase64 = null;
let currentMime = null;

dropZone.addEventListener("click", () => fileInput.click());

dropZone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropZone.style.borderColor = "var(--accent)";
});
dropZone.addEventListener("dragleave", () => {
  dropZone.style.borderColor = "var(--border)";
});
dropZone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropZone.style.borderColor = "var(--border)";
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

function handleFile(file) {
  if (file.size > 3 * 1024 * 1024) {
    alert("Image too large. Max 3 MB (Vercel body limit ≈ 4.5 MB).");
    return;
  }
  currentMime = file.type;
  const reader = new FileReader();
  reader.onload = (e) => {
    currentImageBase64 = e.target.result;
    preview.src = currentImageBase64;
    preview.hidden = false;
    dropText.textContent = file.name;
  };
  reader.readAsDataURL(file);
}

visionBtn.addEventListener("click", async () => {
  if (!currentImageBase64) {
    visionStatus.textContent = "Please select an image first.";
    visionStatus.className = "status error";
    return;
  }
  visionBtn.disabled = true;
  visionStatus.textContent = "Analyzing…";
  visionStatus.className = "status";
  visionOutput.textContent = "";

  try {
    const resp = await fetch(`${API_BASE}/api/vision`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: visionPrompt.value || "Describe this image.",
        imageBase64: currentImageBase64,
        mimeType: currentMime,
        model: modelSelect.value,
      }),
    });

    const data = await resp.json();
    if (!resp.ok || !data.success) throw new Error(data.error || `HTTP ${resp.status}`);

    visionOutput.textContent = data.text;
    visionStatus.textContent = "Done.";
  } catch (err) {
    visionOutput.textContent = "⚠️ " + err.message;
    visionStatus.textContent = "Error: " + err.message;
    visionStatus.className = "status error";
  } finally {
    visionBtn.disabled = false;
  }
});

/* ------------------------ Clear ------------------------- */
document.getElementById("clearBtn").addEventListener("click", () => {
  if (!confirm("Clear conversation history?")) return;
  history.length = 0;
  messages.innerHTML = "";
  visionOutput.textContent = "Output will appear here.";
  preview.hidden = true;
  preview.src = "";
  dropText.textContent = "Click or drop an image here";
  currentImageBase64 = null;
  fileInput.value = "";
  chatStatus.textContent = "Ready.";
});
</script>
</body>
</html>
